<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión — roboRobin</title>
<link rel="icon" href="/images/robin.png" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/consola.css" />
</head>
<body>

<div class="rr-auth-split">
  <!-- El formulario. Lo primero que se ve a la izquierda, donde cae la vista. -->
  <div class="rr-auth-form-side">
    <a href="/index.html" class="rr-auth-back">← Volver al inicio</a>

    <div class="rr-auth-inner">
      <!-- Este Robin reacciona al entrar: celebra si acierta, se apena si no.
           Mientras espera va cambiando de dibujo solo (ver la galería en
           mascot.js); en cuanto hay respuesta, login.js le pone la pose que
           toque y la galería deja de mandar. -->
      <span class="rr-auth-robin rr-galeria" data-rr-galeria data-bob id="authRobin"></span>

      <h1>Qué gusto verte</h1>
      <p class="lead">Entra con tu correo, o con tu ID de estudiante si tu escuela te dio uno.</p>

      <div class="form-error" id="formError"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Correo o ID de estudiante</label>
          <input type="text" id="email" required placeholder="tu@correo.com o STU-00002" autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" />
          <div class="hint">¿Eres estudiante y se te olvidó? Tu profesor o la dirección te la puede cambiar.</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Entrar</button>
      </form>

      <p class="rr-auth-switch">¿Eres nuevo? <a href="/register.html">Crea tu cuenta</a></p>
    </div>
  </div>

  <!-- La ilustración. Cambia en cada recarga (ver js/auth-art.js). -->
  <aside class="rr-auth-art-side" id="authArt"></aside>
</div>

<script src="/js/mascot.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth-art.js"></script>
<script src="/js/login.js"></script>
<script src="/js/consola.js"></script>
</body>
</html>
