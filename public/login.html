<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión — roboRobin</title>
<link rel="icon" href="/images/robin.png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<div class="rr-auth-wrap">
  <div class="rr-auth-card">
    <div class="rr-auth-head">
      <span data-rr-mascot data-bob id="authRobin"></span>
      <h2>Qué gusto verte</h2>
      <p class="text-muted mt-0">Entra a tu cuenta de roboRobin.</p>
    </div>

    <div class="form-error" id="formError"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Correo o ID de estudiante</label>
        <input type="text" id="email" required placeholder="tu@correo.com o STU-00002" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Entrar</button>
    </form>

    <p class="rr-auth-switch">¿Eres nuevo? <a href="/register.html">Crea tu cuenta</a></p>
    <p class="rr-auth-switch" style="margin-top:6px"><a href="/index.html">← Volver al inicio</a></p>
  </div>
</div>

<script src="/js/mascot.js"></script>
<script src="/js/api.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
