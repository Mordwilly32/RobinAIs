<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Un aula con pizarra, pupitres y una ventana grande">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFE3EB"/><stop offset="100%" stop-color="#E9F4F6"/>
    </linearGradient>
    <linearGradient id="pared" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF4EC"/><stop offset="100%" stop-color="#EFE3D6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#pared)"/>
  <rect y="720" width="800" height="280" fill="#D8C4AE"/>
  <path d="M0 720 L800 720 L800 760 L0 790 Z" fill="#C9B29A"/>

  <!-- ventana -->
  <rect x="470" y="150" width="300" height="330" rx="12" fill="url(#cielo)" stroke="#C6B39F" stroke-width="10"/>
  <line x1="620" y1="150" x2="620" y2="480" stroke="#C6B39F" stroke-width="10"/>
  <line x1="470" y1="315" x2="770" y2="315" stroke="#C6B39F" stroke-width="10"/>
  <circle cx="710" cy="215" r="34" fill="#F2A81B" opacity=".9"/>
  <path d="M470 430 q60 -50 120 -14 q50 -40 110 4 l70 -6 v66 h-300 z" fill="#8FC9A0" opacity=".85"/>

  <!-- pizarra -->
  <rect x="50" y="190" width="360" height="250" rx="10" fill="#2E4A44"/>
  <rect x="40" y="180" width="380" height="270" rx="14" fill="none" stroke="#B98E5E" stroke-width="16"/>
  <g stroke="#F7F1E6" stroke-width="7" stroke-linecap="round" opacity=".92">
    <path d="M90 250 h150"/><path d="M90 290 h230"/><path d="M90 330 h110"/>
    <path d="M250 370 l30 -30 l30 30" fill="none"/>
    <circle cx="340" cy="255" r="22" fill="none"/>
  </g>

  <!-- pupitres -->
  <g fill="#C8792E">
    <rect x="70" y="620" width="230" height="26" rx="8"/>
    <rect x="95" y="646" width="18" height="110" rx="6" fill="#9D5D22"/>
    <rect x="258" y="646" width="18" height="110" rx="6" fill="#9D5D22"/>
    <rect x="360" y="660" width="250" height="28" rx="8"/>
    <rect x="390" y="688" width="20" height="120" rx="6" fill="#9D5D22"/>
    <rect x="562" y="688" width="20" height="120" rx="6" fill="#9D5D22"/>
  </g>
  <!-- libros y lápiz sobre el pupitre -->
  <rect x="110" y="592" width="86" height="14" rx="4" fill="#E23A1B"/>
  <rect x="118" y="578" width="86" height="14" rx="4" fill="#2F8FA3"/>
  <rect x="400" y="632" width="100" height="16" rx="4" fill="#F2A81B"/>
  <path d="M520 640 l70 -14 l6 16 l-70 14 z" fill="#2E8B57"/>

  <!-- reloj -->
  <circle cx="210" cy="110" r="42" fill="#FFF" stroke="#C6B39F" stroke-width="8"/>
  <path d="M210 110 v-24 M210 110 l18 12" stroke="#1B1512" stroke-width="6" stroke-linecap="round"/>
</svg>
