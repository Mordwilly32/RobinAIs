<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="El patio de una escuela al atardecer, con árboles y una cancha">
  <defs>
    <linearGradient id="atardecer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2F6E80"/>
      <stop offset="45%" stop-color="#E8A05A"/>
      <stop offset="100%" stop-color="#F2C88A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#atardecer)"/>
  <circle cx="600" cy="430" r="86" fill="#FFE9B8" opacity=".92"/>

  <!-- edificio de la escuela -->
  <g>
    <rect x="70" y="330" width="330" height="290" fill="#F4E7D6"/>
    <path d="M55 330 L235 228 L415 330 Z" fill="#C0472C"/>
    <rect x="200" y="500" width="70" height="120" rx="6" fill="#8B5A3C"/>
    <g fill="#9FD3DE">
      <rect x="105" y="380" width="60" height="60" rx="5"/>
      <rect x="205" y="380" width="60" height="60" rx="5"/>
      <rect x="305" y="380" width="60" height="60" rx="5"/>
      <rect x="105" y="500" width="60" height="60" rx="5"/>
      <rect x="305" y="500" width="60" height="60" rx="5"/>
    </g>
    <!-- campanario -->
    <rect x="212" y="258" width="46" height="60" fill="#F4E7D6"/>
    <circle cx="235" cy="288" r="16" fill="#2E4A44"/>
    <path d="M235 288 v-9 M235 288 l7 5" stroke="#F4E7D6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- suelo -->
  <rect y="620" width="800" height="380" fill="#7BA85F"/>
  <ellipse cx="560" cy="790" rx="250" ry="140" fill="#C98A4B" opacity=".55"/>

  <!-- canasta -->
  <g transform="translate(600,560)">
    <rect x="18" y="0" width="12" height="230" fill="#4A4038"/>
    <rect x="-34" y="0" width="100" height="62" rx="6" fill="#F7F1E6" stroke="#4A4038" stroke-width="6"/>
    <circle cx="16" cy="48" r="17" fill="none" stroke="#E23A1B" stroke-width="6"/>
    <path d="M0 62 l10 26 h14 l10 -26" fill="none" stroke="#F7F1E6" stroke-width="4"/>
  </g>
  <circle cx="470" cy="860" r="30" fill="#E07B2E" stroke="#8B4A18" stroke-width="4"/>
  <path d="M440 860 h60 M470 830 v60" stroke="#8B4A18" stroke-width="4"/>

  <!-- árboles -->
  <g transform="translate(120,600)">
    <rect x="34" y="120" width="26" height="130" rx="8" fill="#7A4B27"/>
    <circle cx="47" cy="96" r="72" fill="#3E7D4F"/>
    <circle cx="8" cy="130" r="46" fill="#4C8F5C"/>
    <circle cx="90" cy="128" r="50" fill="#356E45"/>
  </g>
  <g transform="translate(680,660)">
    <rect x="22" y="90" width="20" height="110" rx="6" fill="#7A4B27"/>
    <circle cx="32" cy="72" r="54" fill="#4C8F5C"/>
    <circle cx="70" cy="100" r="34" fill="#356E45"/>
  </g>

  <!-- pájaros -->
  <g stroke="#1B1512" stroke-width="4" fill="none" opacity=".55" stroke-linecap="round">
    <path d="M300 180 q14 -14 28 0 q14 -14 28 0"/>
    <path d="M400 130 q10 -10 20 0 q10 -10 20 0"/>
  </g>
</svg>
