<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Error 404 — roboRobin</title>
<link rel="icon" href="/images/robin.png" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/landing.css" />
</head>
<body class="rb-page">

<nav class="rb-nav scrolled">
  <div class="rb-wrap rb-nav-inner">
    <a href="/" class="rb-logo">
      <span data-rr-mascot data-small></span>
      <span>Robo<b>Robin</b></span>
    </a>
    <div class="rb-nav-cta">
      <a href="/login.html" class="rb-login">Iniciar sesión</a>
      <a href="/register.html" class="rb-btn rb-btn-primary rb-btn-sm">Empezar gratis</a>
    </div>
  </div>
</nav>

<main class="rb-error">
  <div class="rb-error-inner">
    <span data-rr-mascot data-pose="error" id="errArt"></span>
    <p class="code" id="errCode">404</p>
    <h1 id="errTitle">Esta página no existe</h1>
    <p id="errText">
      Robin buscó por todo el nido y no encontró nada aquí. Puede que la dirección esté mal escrita
      o que esa página nunca haya existido.
    </p>
    <div class="rb-error-actions" id="errActions">
      <a href="/" class="rb-btn rb-btn-primary">← Volver al inicio</a>
      <a href="/login.html" class="rb-btn rb-btn-white">Iniciar sesión</a>
    </div>
    <p class="rb-error-detail" id="errDetail"></p>
  </div>
</main>

<script src="/js/mascot.js"></script>
<script>
// El mensaje cambia según por qué se llegó aquí. El servidor y la aplicación
// mandan el motivo en la URL: ?motivo=sesion, ?motivo=permiso, ?ruta=/lo-que-sea
(function () {
  const params = new URLSearchParams(location.search);
  // El motivo llega por la URL (cuando la app manda aquí) o marcado en el
  // <body> por el servidor (cuando responde 404 o 500 sin cambiar de página).
  const motivo = params.get('motivo') || document.body.dataset.motivo;
  const ruta = params.get('ruta');

  // Cada caso tiene su Robin: estrellado cuando la pantalla se rompió,
  // triste cuando el problema es de permisos o de sesión.
  const CASOS = {
    sesion: {
      pose: 'sad',
      code: '401',
      title: 'Necesitas iniciar sesión',
      text: 'Esa página es parte de tu panel y tu sesión no está abierta o ya venció. Entra con tu cuenta y vuelve a intentarlo.',
      actions: '<a href="/login.html" class="rb-btn rb-btn-primary">Iniciar sesión</a><a href="/" class="rb-btn rb-btn-white">Volver al inicio</a>'
    },
    permiso: {
      pose: 'sad',
      code: '403',
      title: 'Esta página no es para tu cuenta',
      text: 'Entraste a un panel que le corresponde a otro tipo de cuenta. Cada rol —director, profesor, estudiante o cuenta personal— tiene el suyo.',
      actions: '<a href="/" class="rb-btn rb-btn-primary">Volver al inicio</a><a href="/login.html" class="rb-btn rb-btn-white">Entrar con otra cuenta</a>'
    },
    servidor: {
      pose: 'error',
      code: '500',
      title: 'Algo se rompió de este lado',
      text: 'El servidor tuvo un problema al preparar esta página. Vuelve a intentarlo; si sigue igual, revisa la terminal donde corre roboRobin.',
      actions: '<a href="/" class="rb-btn rb-btn-primary">Volver al inicio</a>'
    }
  };

  const caso = CASOS[motivo];
  if (caso) {
    document.title = `Error ${caso.code} — roboRobin`;
    document.getElementById('errCode').textContent = caso.code;
    document.getElementById('errTitle').textContent = caso.title;
    document.getElementById('errText').textContent = caso.text;
    document.getElementById('errActions').innerHTML = caso.actions;

    if (caso.pose) {
      const art = document.getElementById('errArt');
      art.dataset.pose = caso.pose;
      art.dataset.rrMounted = '';
      art.innerHTML = '';
      rrMountMascots();
    }
  }

  // Cuando el servidor responde 404 conserva la dirección original en la barra,
  // así que si no viene el parámetro se toma de ahí.
  const pedida = ruta || (location.pathname !== '/404.html' ? location.pathname : '');
  if (pedida) {
    document.getElementById('errDetail').textContent = 'Dirección solicitada: ' + pedida;
  }
})();
</script>
</body>
</html>
