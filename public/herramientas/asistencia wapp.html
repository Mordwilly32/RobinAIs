<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asistencia</title>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<style>

/* =========================================================
   CONFIGURACIÓN GENERAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    padding: 0;
}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f7f5f2;

    color: #171313;
}


/* =========================================================
   ENCABEZADO
========================================================= */

header {

    height: 48px;

    background: #151110;

    border-bottom:
        1px solid #2d2724;

    display: flex;

    align-items: center;

    padding: 0 18px;

    font-size: 17px;

    font-weight: bold;

    color: #ffffff;
}


/* =========================================================
   CONTENEDOR PRINCIPAL
========================================================= */

.container {

    display: grid;

    grid-template-columns:
        280px minmax(0, 1fr);

    min-height:
        calc(100vh - 48px);
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

    background: #211c19;

    border-right:
        1px solid #3a312c;

    padding: 15px;

    display: flex;

    flex-direction: column;

    overflow-y: auto;

    color: #ffffff;

    min-width: 0;
}


.sidebar h2 {

    margin:
        0 0 14px 0;

    font-size: 17px;

    color: #ffffff;
}


/* =========================================================
   INPUTS
========================================================= */

.input {

    width: 100%;

    padding: 10px;

    margin-bottom: 9px;

    border:
        1px solid #d9cec5;

    border-radius: 7px;

    background: #fffdfb;

    color: #171313;

    outline: none;

    font-size: 14px;
}


.input::placeholder {
    color: #9b918a;
}


.input:focus {

    border-color:
        #ef3b1f;

    box-shadow:
        0 0 0 2px
        rgba(239, 59, 31, 0.12);
}


/* =========================================================
   AYUDA TELEFONO
========================================================= */

.phone-help {

    font-size: 11px;

    color: #aaa09a;

    margin:
        -3px 0 9px 1px;
}


/* =========================================================
   BOTONES
========================================================= */

button {

    border: none;

    border-radius: 7px;

    padding:
        10px 13px;

    cursor: pointer;

    font-weight: bold;

    transition:
        background 0.2s,
        transform 0.15s,
        filter 0.2s;
}


button:hover {

    filter: brightness(1.05);

    transform:
        translateY(-1px);
}


button:active {

    transform:
        translateY(0);
}


/* =========================================================
   BOTONES PRINCIPALES
========================================================= */

.btn-primary {

    background:
        #ef3b1f;

    color:
        #ffffff;
}


.btn-primary:hover {
    background: #d9321a;
}


.btn-success {

    background:
        #2f8f5b;

    color:
        #ffffff;
}


.btn-success:hover {
    background: #27794d;
}


.btn-danger {

    background:
        #e83a21;

    color:
        #ffffff;
}


.btn-danger:hover {
    background: #c9311c;
}


.btn-secondary {

    background:
        #302925;

    color:
        #ffffff;
}


.btn-secondary:hover {
    background: #403832;
}


/* =========================================================
   LISTA PERSONAS
========================================================= */

.person-list {

    margin-top:
        18px;

    display:
        flex;

    flex-direction:
        column;

    gap:
        9px;
}


.person-card {

    background:
        #151110;

    border:
        1px solid #3a312c;

    border-radius:
        9px;

    padding:
        10px;

    color:
        #ffffff;
}


.person-header {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        7px;
}


.person-name {

    font-weight:
        bold;

    color:
        #ffffff;

    font-size:
        14px;

    overflow:
        hidden;

    text-overflow:
        ellipsis;
}


.person-phone {

    margin-top:
        5px;

    font-size:
        11px;

    color:
        #9ca3af;
}


.status {

    font-size:
        10px;

    padding:
        4px 7px;

    border-radius:
        20px;

    font-weight:
        bold;

    flex-shrink:
        0;
}


.status.absent {

    background:
        #4a2420;

    color:
        #ffb2a5;
}


.status.present {

    background:
        #204a35;

    color:
        #a9e6c3;
}


.person-actions {

    display:
        flex;

    gap:
        5px;

    margin-top:
        9px;

    flex-wrap:
        wrap;
}


.person-actions button {

    font-size:
        11px;

    padding:
        6px 7px;
}


/* =========================================================
   PANEL PRINCIPAL
========================================================= */

.main {

    background:
        #f7f5f2;

    padding:
        14px;

    overflow-y:
        auto;

    min-width:
        0;
}


/* =========================================================
   CONTROLES SUPERIORES
========================================================= */

.top-controls {

    width:
        100%;

    max-width:
        1000px;

    margin:
        0 auto 10px auto;

    display:
        flex;

    align-items:
        center;

    gap:
        8px;

    flex-wrap:
        wrap;
}


/* =========================================================
   BOTON PANTALLA COMPLETA
========================================================= */

.fullscreen-btn {

    margin-left:
        auto;

    background:
        #302925;

    color:
        #ffffff;
}


/* =========================================================
   INFORMACIÓN SUPERIOR
========================================================= */

.top-info {

    width:
        100%;

    max-width:
        1000px;

    margin:
        0 auto 10px auto;

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        10px;
}


.info {

    background:
        #fffdfb;

    border:
        1px solid #e1d8d1;

    border-radius:
        10px;

    padding:
        10px 13px;

    box-shadow:
        0 2px 7px
        rgba(50, 35, 25, 0.07);

    color:
        #171313;
}


.info-title {

    font-size:
        12px;

    color:
        #81766f;
}


.info-value {

    font-size:
        18px;

    font-weight:
        bold;

    margin-top:
        3px;

    color:
        #171313;
}


/* =========================================================
   CONTENEDOR DE CAMARA

   IMPORTANTE:

   La altura nunca podrá superar el 80% de
   la altura disponible de la ventana.

   También se utiliza width para que en
   pantallas anchas no se vuelva exageradamente grande.
========================================================= */

.camera-container {

    position:
        relative;

    width:
        100%;

    max-width:
        1000px;

    max-height:
        80vh;

    height:
        min(
            80vh,
            calc(100vw * 0.75)
        );

    margin:
        0 auto;

    background:
        #151110;

    border-radius:
        12px;

    overflow:
        hidden;

    border:
        1px solid #d8cec6;

    box-shadow:
        0 2px 8px
        rgba(40, 30, 25, 0.08);

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;
}


/* =========================================================
   VIDEO

   contain evita que la cámara sea cortada.
========================================================= */

#video {

    display:
        block;

    width:
        100%;

    height:
        100%;

    object-fit:
        contain;

    background:
        #151110;

    transform:
        scaleX(-1);
}


/* =========================================================
   CANVAS
========================================================= */

#overlay {

    position:
        absolute;

    left:
        0;

    top:
        0;

    width:
        100%;

    height:
        100%;

    pointer-events:
        none;
}


/* =========================================================
   MENSAJE DE CAMARA
========================================================= */

.camera-message {

    position:
        absolute;

    left:
        12px;

    bottom:
        12px;

    background:
        rgba(21, 17, 16, 0.88);

    padding:
        8px 12px;

    border-radius:
        7px;

    font-size:
        13px;

    color:
        #ffffff;

    border:
        1px solid
        rgba(255,255,255,0.08);

    z-index:
        5;
}


/* =========================================================
   INFORMACION INFERIOR

   Se mantiene por debajo de la cámara.
========================================================= */

.bottom-info {

    max-width:
        1000px;

    margin:
        10px auto 0 auto;

    display:
        none;
}


/* =========================================================
   LOADING
========================================================= */

.loading {

    position:
        fixed;

    inset:
        0;

    background:
        rgba(21, 17, 16, 0.97);

    z-index:
        9999;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    flex-direction:
        column;

    gap:
        15px;

    color:
        #ffffff;
}


.spinner {

    width:
        40px;

    height:
        40px;

    border:
        4px solid #493f3a;

    border-top-color:
        #ef3b1f;

    border-radius:
        50%;

    animation:
        spin 1s linear infinite;
}


@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }
}


.hidden {

    display:
        none !important;
}


/* =========================================================
   ESTADO VACIO
========================================================= */

.empty {

    color:
        #a0958e;

    text-align:
        center;

    padding:
        20px;

    font-size:
        13px;
}


/* =========================================================
   MODAL
========================================================= */

.modal {

    position:
        fixed;

    inset:
        0;

    background:
        rgba(21,17,16,0.72);

    z-index:
        5000;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        15px;
}


.modal.hidden {
    display: none !important;
}


.modal-content {

    width:
        100%;

    max-width:
        720px;

    max-height:
        90vh;

    overflow:
        hidden;

    background:
        #fffdfb;

    border-radius:
        14px;

    box-shadow:
        0 15px 50px
        rgba(0,0,0,0.30);

    display:
        flex;

    flex-direction:
        column;
}


.modal-header {

    padding:
        18px 20px;

    background:
        #151110;

    color:
        #ffffff;

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        10px;
}


.modal-title {

    font-size:
        20px;

    font-weight:
        bold;
}


.modal-close {

    width:
        34px;

    height:
        34px;

    padding:
        0;

    border-radius:
        50%;

    background:
        #302925;

    color:
        #ffffff;

    font-size:
        20px;

    line-height:
        34px;
}


.modal-body {

    padding:
        18px;

    overflow:
        auto;
}


/* =========================================================
   ESTADISTICAS
========================================================= */

.stats {

    display:
        grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap:
        9px;

    margin-bottom:
        18px;
}


.stat {

    background:
        #f4f0ec;

    border:
        1px solid #e1d8d1;

    border-radius:
        9px;

    padding:
        11px;

    text-align:
        center;
}


.stat-label {

    font-size:
        11px;

    color:
        #81766f;
}


.stat-value {

    margin-top:
        4px;

    font-size:
        20px;

    font-weight:
        bold;

    color:
        #171313;
}


/* =========================================================
   LISTA FINAL
========================================================= */

.final-list {

    display:
        flex;

    flex-direction:
        column;

    gap:
        7px;

    max-height:
        45vh;

    overflow-y:
        auto;
}


.final-item {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        10px;

    padding:
        10px 12px;

    border:
        1px solid #e1d8d1;

    border-radius:
        8px;

    background:
        #ffffff;
}


.final-person {
    min-width: 0;
}


.final-name {

    font-weight:
        bold;

    font-size:
        14px;
}


.final-phone {

    font-size:
        11px;

    color:
        #8b817b;

    margin-top:
        3px;
}


.final-status {

    display:
        flex;

    align-items:
        center;

    gap:
        7px;

    flex-shrink:
        0;
}


.badge-present,
.badge-absent {

    padding:
        5px 8px;

    border-radius:
        20px;

    font-size:
        10px;

    font-weight:
        bold;
}


.badge-present {

    background:
        #dcefe4;

    color:
        #216b43;
}


.badge-absent {

    background:
        #f8dfdb;

    color:
        #a52d1d;
}


/* =========================================================
   WHATSAPP
========================================================= */

.btn-whatsapp {

    background:
        #25D366;

    color:
        #ffffff;

    font-size:
        11px;

    padding:
        7px 9px;

    white-space:
        nowrap;
}


.btn-whatsapp:hover {
    background: #1eae55;
}


/* =========================================================
   MODAL FOOTER
========================================================= */

.modal-footer {

    padding:
        13px 18px;

    border-top:
        1px solid #e1d8d1;

    display:
        flex;

    justify-content:
        flex-end;

    gap:
        8px;
}


/* =========================================================
   TODOS PRESENTES
========================================================= */

.all-present {

    padding:
        25px;

    text-align:
        center;

    background:
        #edf8f1;

    color:
        #216b43;

    border:
        1px solid #cce9d7;

    border-radius:
        10px;

    font-weight:
        bold;
}


/* =========================================================
   SCROLLBAR
========================================================= */

.sidebar::-webkit-scrollbar,
.main::-webkit-scrollbar,
.modal-list::-webkit-scrollbar,
.final-list::-webkit-scrollbar {

    width:
        7px;
}


.sidebar::-webkit-scrollbar-track,
.main::-webkit-scrollbar-track,
.final-list::-webkit-scrollbar-track {

    background:
        transparent;
}


.sidebar::-webkit-scrollbar-thumb {

    background:
        #4a403b;

    border-radius:
        10px;
}


.main::-webkit-scrollbar-thumb,
.final-list::-webkit-scrollbar-thumb {

    background:
        #cfc4bc;

    border-radius:
        10px;
}


/* =========================================================
   MODO PANTALLA COMPLETA
========================================================= */

.main.camera-fullscreen {

    position:
        fixed;

    inset:
        0;

    z-index:
        4000;

    background:
        #151110;

    padding:
        10px;

    overflow:
        hidden;

    display:
        flex;

    flex-direction:
        column;

    justify-content:
        center;

    align-items:
        center;
}


.main.camera-fullscreen
.top-controls {

    position:
        absolute;

    top:
        10px;

    left:
        10px;

    right:
        10px;

    width:
        auto;

    max-width:
        none;

    z-index:
        20;
}


.main.camera-fullscreen
.top-info {

    position:
        absolute;

    bottom:
        10px;

    left:
        10px;

    right:
        10px;

    width:
        auto;

    max-width:
        1000px;

    z-index:
        20;

    margin:
        0 auto;
}


.main.camera-fullscreen
.camera-container {

    width:
        100%;

    height:
        calc(100vh - 20px);

    max-width:
        calc(100vw - 20px);

    max-height:
        calc(100vh - 20px);

    margin:
        0;
}


.main.camera-fullscreen
#video {

    width:
        100%;

    height:
        100%;
}


.main.camera-fullscreen
.fullscreen-btn {

    margin-left:
        auto;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width: 800px) {

    .container {

        grid-template-columns:
            1fr;

        min-height:
            auto;
    }


    .sidebar {

        border-right:
            none;

        border-bottom:
            1px solid #3a312c;

        max-height:
            390px;
    }


    .main {

        padding:
            10px;
    }


    .top-info {

        grid-template-columns:
            1fr 1fr;
    }


    .camera-container {

        width:
            100%;

        max-width:
            100%;

        height:
            min(
                80vh,
                calc(100vw * 0.75)
            );
    }


    .stats {

        grid-template-columns:
            repeat(2, 1fr);
    }


    .final-item {

        align-items:
            flex-start;

        flex-direction:
            column;
    }


    .final-status {

        width:
            100%;

        justify-content:
            space-between;
    }

}


@media(max-width: 500px) {

    .top-controls {

        display:
            grid;

        grid-template-columns:
            1fr 1fr;
    }


    .top-controls button {

        width:
            100%;
    }


    .fullscreen-btn {

        margin-left:
            0;
    }


    .top-info {

        grid-template-columns:
            1fr;
    }


    .camera-container {

        max-height:
            80vh;
    }

}


</style>

</head>


<body>


<!-- =====================================================
     ENCABEZADO
====================================================== -->

<header>
    Asistencia
</header>


<div class="container">


<!-- =====================================================
     SIDEBAR
====================================================== -->

<aside class="sidebar">

    <h2>Personas</h2>


    <input
        id="personName"
        class="input"
        type="text"
        placeholder="Nombre de la persona"
    >


    <input
        id="personPhone"
        class="input"
        type="tel"
        value="503"
        placeholder="Teléfono"
    >


    <div class="phone-help">
        Código de país 503 por defecto. Puedes modificarlo.
    </div>


    <button
        class="btn-primary"
        onclick="crearPersona()"
    >
        + Agregar persona
    </button>


    <div
        id="personList"
        class="person-list"
    >

        <div class="empty">
            No hay personas registradas.
        </div>

    </div>

</aside>



<!-- =====================================================
     PANEL PRINCIPAL
====================================================== -->

<main
    id="mainPanel"
    class="main"
>


    <!-- =================================================
         BOTONES ARRIBA DE LA CAMARA
    ================================================== -->

    <div class="top-controls">

        <button
            id="startCameraBtn"
            class="btn-success"
            onclick="iniciarCamara()"
        >
            Iniciar cámara
        </button>


        <button
            class="btn-danger"
            onclick="finalizarAsistencia()"
        >
            Finalizar asistencia
        </button>


        <button
            class="btn-secondary"
            onclick="reiniciarAsistencia()"
        >
            Reiniciar asistencia
        </button>


        <button
            id="fullscreenBtn"
            class="fullscreen-btn"
            onclick="alternarPantallaCompleta()"
        >
            ⛶ Pantalla completa
        </button>

    </div>



    <!-- =================================================
         INFORMACION ARRIBA DE LA CAMARA
    ================================================== -->

    <div class="top-info">


        <div class="info">

            <div class="info-title">
                Personas presentes
            </div>

            <div
                id="presentCount"
                class="info-value"
            >
                0 / 0
            </div>

        </div>


        <div class="info">

            <div class="info-title">
                Estado del reconocimiento
            </div>

            <div
                id="recognitionStatus"
                class="info-value"
            >
                Esperando cámara...
            </div>

        </div>


    </div>



    <!-- =================================================
         CAMARA
    ================================================== -->

    <div class="camera-container">

        <video
            id="video"
            autoplay
            muted
            playsinline
        ></video>


        <canvas
            id="overlay"
        ></canvas>


        <div
            id="cameraMessage"
            class="camera-message"
        >
            Cámara detenida
        </div>

    </div>


</main>

</div>



<!-- =====================================================
     MODAL ASISTENCIA
====================================================== -->

<div
    id="attendanceModal"
    class="modal hidden"
>

    <div class="modal-content">


        <div class="modal-header">

            <div class="modal-title">
                Resultado de asistencia
            </div>


            <button
                class="modal-close"
                onclick="cerrarModal()"
            >
                ×
            </button>

        </div>



        <div class="modal-body">


            <div class="stats">


                <div class="stat">

                    <div class="stat-label">
                        Total
                    </div>

                    <div
                        id="statTotal"
                        class="stat-value"
                    >
                        0
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        Presentes
                    </div>

                    <div
                        id="statPresentes"
                        class="stat-value"
                    >
                        0
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        Ausentes
                    </div>

                    <div
                        id="statAusentes"
                        class="stat-value"
                    >
                        0
                    </div>

                </div>


                <div class="stat">

                    <div class="stat-label">
                        Asistencia
                    </div>

                    <div
                        id="statPorcentaje"
                        class="stat-value"
                    >
                        0%
                    </div>

                </div>


            </div>



            <div
                id="finalList"
                class="final-list"
            ></div>


        </div>



        <div class="modal-footer">

            <button
                class="btn-secondary"
                onclick="cerrarModal()"
            >
                Cerrar
            </button>

        </div>


    </div>

</div>



<!-- =====================================================
     LOADING
====================================================== -->

<div
    id="loading"
    class="loading"
>

    <div class="spinner"></div>

    <div id="loadingText">
        Cargando modelos de reconocimiento...
    </div>

</div>



<script>

/* =========================================================
   WHATSAPP
========================================================= */

function avisarInasistencia(
    id
) {

    const persona =
        personas.find(
            p => p.id === id
        );


    if (!persona)
        return;


    if (
        persona.presente
    ) {

        alert(
            persona.nombre +

            "recognitionStatus"

/* =========================================================
   PANTALLA COMPLETA
========================================================= */

function alternarPantallaCompleta() {

    const main =
        document.getElementById(
            "mainPanel"
        );


    const boton =
        document.getElementById(
            "fullscreenBtn"
        );


    const activo =
        main.classList.toggle(
            "camera-fullscreen"
        );


    if (activo) {

        boton.textContent =
            "✕ Salir de pantalla completa";


        /*
            Si el navegador permite fullscreen,
            también lo solicitamos.
        */

        if (
            document.documentElement.requestFullscreen
        ) {

            document.documentElement
                .requestFullscreen()
                .catch(
                    () => {}
                );

        }

    } else {

        boton.textContent =
            "⛶ Pantalla completa";


        if (
            document.fullscreenElement
        ) {

            document.exitFullscreen()
                .catch(
                    () => {}
                );

        }

    }


    /*
        Esperamos un momento para que
        el navegador termine de cambiar
        el tamaño y ajustamos el canvas.
    */

    setTimeout(
        ajustarCanvas,
        150
    );

}


/* =========================================================
   CAMBIO DE FULLSCREEN DEL NAVEGADOR
========================================================= */

document.addEventListener(
    "fullscreenchange",
    function() {

        const main =
            document.getElementById(
                "mainPanel"
            );


        const boton =
            document.getElementById(
                "fullscreenBtn"
            );


        /*
            Si el usuario presiona ESC,
            también salimos de nuestro modo.
        */

        if (
            !document.fullscreenElement &&
            main.classList.contains(
                "camera-fullscreen"
            )
        ) {

            main.classList.remove(
                "camera-fullscreen"
            );


            boton.textContent =
                "⛶ Pantalla completa";

        }


        setTimeout(
            ajustarCanvas,
            150
        );

    }
);


/* =========================================================
   AJUSTAR CANVAS
========================================================= */

function ajustarCanvas() {

    if (
        video.videoWidth &&
        video.videoHeight
    ) {

        overlay.width =
            video.videoWidth;

        overlay.height =
            video.videoHeight;

    }

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHTML(
    text
) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}
