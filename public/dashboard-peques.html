<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Robin — roboRobin</title>
<link rel="icon" href="/images/robin.png" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/loading/style.css" />
<link rel="stylesheet" href="/css/consola.css" />
</head>
<body>

<!--
  La pantalla de los más peques: parvularia y los primeros grados.

  Casi no hay interfaz. Robin ocupa el centro, en grande, y todo se hace con
  botones enormes y una frase corta. No hay menú lateral, ni secciones, ni
  nada que leer: a esta edad, cada palabra de más es una palabra que estorba.

  Parvularia ve solo los juegos. De primero a tercero, además, puede hablar
  con Robin (escribiéndole o con el micrófono).
-->

<div class="rr-kids" id="rrKids">
  <header class="rr-kids-top">
    <div class="rr-kids-hi">
      <span id="kidAvatar"></span>
      <span>
        <strong id="kidName">Hola</strong>
        <small id="kidSchool"></small>
      </span>
    </div>
    <button class="btn btn-sm btn-ghost" id="kidLogout">Salir</button>
  </header>

  <main class="rr-kids-stage" id="kidStage"></main>
</div>

<script src="/js/mascot.js"></script>
<script src="/js/api.js"></script>
<script src="/js/loading.js"></script>
<!-- El modo enfocado (/-/robinAI, /-/minijuegos) va antes: es quien decide
     con qué pantalla se arranca y si hay botón de volver. -->
<script src="/js/enfoque.js"></script>
<script src="/js/peques.js"></script>
<script src="/js/consola.js"></script>
</body>
</html>
