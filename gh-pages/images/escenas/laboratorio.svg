<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Un laboratorio de ciencias con matraces, un microscopio y un mapa del sistema solar">
  <defs>
    <linearGradient id="lab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F3F49"/><stop offset="100%" stop-color="#14262C"/>
    </linearGradient>
    <linearGradient id="liquido1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5FD6C2"/><stop offset="100%" stop-color="#2E8B57"/>
    </linearGradient>
    <linearGradient id="liquido2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7C24B"/><stop offset="100%" stop-color="#E23A1B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#lab)"/>

  <!-- sistema solar en la pared -->
  <g opacity=".35" fill="none" stroke="#9FD3DE" stroke-width="3">
    <circle cx="560" cy="250" r="80"/><circle cx="560" cy="250" r="130"/><circle cx="560" cy="250" r="184"/>
  </g>
  <circle cx="560" cy="250" r="30" fill="#F2A81B"/>
  <circle cx="640" cy="250" r="12" fill="#9FD3DE" opacity=".8"/>
  <circle cx="470" cy="180" r="15" fill="#E23A1B" opacity=".8"/>
  <circle cx="560" cy="434" r="10" fill="#E8DCCB" opacity=".8"/>

  <!-- fórmulas escritas -->
  <g stroke="#E8DCCB" stroke-width="5" stroke-linecap="round" opacity=".5" fill="none">
    <path d="M70 160 h60 M100 130 v60"/>
    <path d="M170 160 h60"/>
    <path d="M70 250 q30 -40 60 0 q30 40 60 0"/>
    <circle cx="150" cy="330" r="26"/>
    <path d="M110 400 h120 M110 430 h80"/>
  </g>

  <!-- mesa -->
  <rect y="700" width="800" height="300" fill="#2A4A54"/>
  <rect y="700" width="800" height="18" fill="#3C6672"/>

  <!-- matraz grande -->
  <g transform="translate(120,520)">
    <path d="M58 0 h44 v70 l64 106 a34 34 0 0 1 -28 52 h-116 a34 34 0 0 1 -28 -52 l64 -106 z"
          fill="#9FD3DE" opacity=".25" stroke="#CFE9EF" stroke-width="6"/>
    <path d="M18 150 l24 -40 h76 l24 40 a34 34 0 0 1 -28 78 h-68 a34 34 0 0 1 -28 -78 z" fill="url(#liquido1)"/>
    <circle cx="66" cy="180" r="7" fill="#EAFBF5" opacity=".7"/>
    <circle cx="96" cy="200" r="5" fill="#EAFBF5" opacity=".6"/>
    <circle cx="80" cy="150" r="4" fill="#EAFBF5" opacity=".6"/>
    <rect x="52" y="-14" width="56" height="16" rx="6" fill="#CFE9EF"/>
  </g>

  <!-- probeta -->
  <g transform="translate(320,590)">
    <rect x="0" y="0" width="52" height="160" rx="24" fill="#9FD3DE" opacity=".22" stroke="#CFE9EF" stroke-width="5"/>
    <path d="M4 74 h44 v62 a22 22 0 0 1 -44 0 z" fill="url(#liquido2)"/>
    <rect x="-8" y="-12" width="68" height="14" rx="6" fill="#CFE9EF"/>
  </g>

  <!-- microscopio -->
  <g transform="translate(470,540)" fill="#E8DCCB">
    <rect x="0" y="180" width="150" height="24" rx="10"/>
    <rect x="58" y="70" width="22" height="118"/>
    <path d="M56 70 q10 -70 72 -66 l10 26 q-46 -6 -54 46 z"/>
    <rect x="96" y="28" width="30" height="58" rx="10" transform="rotate(18 111 57)"/>
    <rect x="18" y="140" width="106" height="12" rx="6" fill="#9FD3DE"/>
    <circle cx="120" cy="146" r="14" fill="#2F8FA3"/>
  </g>

  <!-- cuaderno y lápiz -->
  <g transform="translate(80,760)">
    <rect width="150" height="100" rx="8" fill="#F7F1E6" transform="rotate(-6)"/>
    <g stroke="#C9B29A" stroke-width="4" transform="rotate(-6)">
      <path d="M18 34 h114"/><path d="M18 56 h114"/><path d="M18 78 h76"/>
    </g>
  </g>
</svg>
