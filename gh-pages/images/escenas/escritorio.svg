<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Un escritorio de estudio visto desde arriba, con cuaderno, café y una planta">
  <defs>
    <linearGradient id="madera" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C08A52"/><stop offset="100%" stop-color="#9A6836"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#madera)"/>
  <!-- veta de la madera -->
  <g stroke="#8A5C2E" stroke-width="3" opacity=".3" fill="none">
    <path d="M0 120 q400 40 800 0"/><path d="M0 300 q400 -40 800 0"/>
    <path d="M0 500 q400 50 800 0"/><path d="M0 700 q400 -40 800 0"/>
    <path d="M0 880 q400 40 800 0"/>
  </g>

  <!-- cuaderno abierto -->
  <g transform="translate(130,280) rotate(-4)">
    <rect width="500" height="400" rx="14" fill="#1B1512" opacity=".12" transform="translate(6,10)"/>
    <rect width="500" height="400" rx="14" fill="#FBF6ED"/>
    <line x1="250" y1="0" x2="250" y2="400" stroke="#E0D3BF" stroke-width="4"/>
    <g stroke="#D9CBB5" stroke-width="3">
      <path d="M36 70 h180"/><path d="M36 112 h180"/><path d="M36 154 h180"/><path d="M36 196 h140"/>
      <path d="M286 70 h180"/><path d="M286 112 h180"/><path d="M286 154 h120"/>
    </g>
    <!-- apuntes escritos -->
    <g stroke="#2F8FA3" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M36 250 h90"/><path d="M36 280 h150"/><path d="M36 310 h60"/>
    </g>
    <g stroke="#E23A1B" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M286 230 h120"/><path d="M286 260 h80"/>
      <rect x="286" y="290" width="150" height="70" rx="8"/>
    </g>
  </g>

  <!-- lápiz -->
  <g transform="translate(600,330) rotate(22)">
    <rect width="26" height="300" rx="6" fill="#F2A81B"/>
    <rect y="0" width="26" height="40" rx="6" fill="#E8A0A0"/>
    <path d="M0 300 l13 44 l13 -44 z" fill="#E8DCCB"/>
    <path d="M6 336 l7 8 l7 -8 z" fill="#1B1512"/>
  </g>

  <!-- taza -->
  <g transform="translate(590,720)">
    <circle cx="70" cy="70" r="70" fill="#F7F1E6"/>
    <circle cx="70" cy="70" r="54" fill="#6B4226"/>
    <circle cx="70" cy="70" r="54" fill="#8B5A34" opacity=".5"/>
    <path d="M140 42 a34 34 0 0 1 0 56" fill="none" stroke="#F7F1E6" stroke-width="16"/>
  </g>

  <!-- planta -->
  <g transform="translate(70,760)">
    <path d="M22 60 h96 l-12 110 h-72 z" fill="#C0472C"/>
    <rect x="14" y="44" width="112" height="24" rx="8" fill="#D4573A"/>
    <g fill="#3E7D4F">
      <ellipse cx="46" cy="16" rx="26" ry="40" transform="rotate(-24 46 16)"/>
      <ellipse cx="96" cy="14" rx="24" ry="38" transform="rotate(22 96 14)"/>
      <ellipse cx="70" cy="-8" rx="22" ry="44"/>
    </g>
  </g>

  <!-- clips y notas -->
  <rect x="330" y="760" width="110" height="110" rx="6" fill="#F7C24B" transform="rotate(-8 385 815)"/>
  <g stroke="#B9902A" stroke-width="4" transform="rotate(-8 385 815)">
    <path d="M352 800 h66"/><path d="M352 824 h66"/><path d="M352 848 h40"/>
  </g>
  <g fill="none" stroke="#9AA7AD" stroke-width="7" stroke-linecap="round">
    <path d="M470 230 v40 a14 14 0 0 0 28 0 v-46 a20 20 0 0 0 -40 0 v52"/>
  </g>
</svg>
