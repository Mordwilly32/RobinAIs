      <rect x="64" width="20" height="122" rx="4" fill="#2F8FA3"/><rect x="90" y="16" width="26" height="106" rx="4" fill="#E8DCCB"/>
      <rect x="122" width="22" height="122" rx="4" fill="#2E8B57"/><rect x="150" y="6" width="30" height="116" rx="4" fill="#A72410"/>
