<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Una biblioteca con estanterías llenas de libros y una lámpara encendida">
  <defs>
    <linearGradient id="bfondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B2A22"/><stop offset="100%" stop-color="#241812"/>
    </linearGradient>
    <radialGradient id="luz" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2A81B" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#F2A81B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bfondo)"/>

  <!-- estanterías -->
  <g>
    <rect x="40" y="90" width="720" height="620" rx="10" fill="#4A3529"/>
    <g fill="#3A2920">
