      <rect x="118" y="8" width="26" height="122" rx="4" fill="#2E8B57"/><rect x="150" width="22" height="130" rx="4" fill="#A72410"/>
      <rect x="178" y="18" width="28" height="112" rx="4" fill="#F2A81B"/><rect x="212" width="20" height="130" rx="4" fill="#2F8FA3"/>
      <rect x="238" y="6" width="24" height="124" rx="4" fill="#E8DCCB"/><rect x="268" width="30" height="130" rx="4" fill="#E23A1B"/>
    </g>
    <g transform="translate(430,140)">
      <rect width="22" height="120" rx="4" fill="#2E8B57"/><rect x="28" y="10" width="28" height="110" rx="4" fill="#E8DCCB"/>
      <rect x="62" width="20" height="120" rx="4" fill="#E23A1B"/><rect x="88" y="6" width="26" height="114" rx="4" fill="#2F8FA3"/>
      <rect x="120" width="24" height="120" rx="4" fill="#F2A81B"/><rect x="150" y="14" width="22" height="106" rx="4" fill="#A72410"/>
      <rect x="178" width="30" height="120" rx="4" fill="#E8DCCB"/><rect x="214" y="8" width="20" height="112" rx="4" fill="#2E8B57"/>
