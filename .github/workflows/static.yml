# Publica en GitHub Pages la versión sin servidor de roboRobin.
#
# Lo que se sube es gh-pages/, que NO está en el repositorio: lo arma
# tools/build-pages.js en cada push. Así la demostración nunca se queda vieja
# —que es lo que pasaría con una copia guardada a mano— y el repositorio no
# carga con cuatro megas de archivos repetidos.
#
# Ojo con lo que esto es y lo que no es: la versión de Pages corre el servidor
# entero dentro de la pestaña, con la base de datos en memoria. Se puede tocar
# todo y no se guarda nada. Para una escuela de verdad hace falta el servidor
# de Node con Supabase detrás — ver docs/supabase.md.

name: Publicar la demostración en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez, sin cortar la que esté a medias.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Sin npm install: build-pages.js solo usa fs y path.
      #
      # RR_PAGES_DOMINIO es una variable del repositorio (Settings → Secrets
      # and variables → Actions → Variables). Si está puesta, el build escribe
      # el archivo CNAME y la demostración contesta en ese dominio. Si no
      # está, se publica en la dirección de github.io de siempre.
      - name: Armar gh-pages/
        env:
          RR_PAGES_DOMINIO: ${{ vars.RR_PAGES_DOMINIO }}
        run: node tools/build-pages.js

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'gh-pages'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
